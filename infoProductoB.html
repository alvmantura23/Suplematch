<!DOCTYPE html>
<html lang="en">
<head>
    <title>Información del Producto</title>
    <link rel="stylesheet" href=infoProductoB.css>
</head>
<body>
    <div class="container">
        <h1>Gold Standard Pro Gainer</h1>
        <div class="product-info">
            <div class="product-image">
                <img src=media/P2_Gold_Standard_Gainer.jfif alt="">
            </div>
            <div class="product-details">
                <p>Es una fórmula alta en proteínas que proporciona calorías que cuentan durante la recuperación. Cada batido proporciona abundantes proteínas suplementarias, carbohidratos, vitaminas y minerales</p>
                <p>Sabor Vainilla</p>
                <p>Estado: Disponible</p>
                <p class="price">Precio: S/0.00 <!-- Cambia este precio si es necesario --></p>
                <div class="quantity">
                    <img src=media/shoppingcart32px.png alt="">
                    <label for="quantity">Cantidad:</label>
                    <input type="number" id="quantity" name="quantity" min="1" value="1">
                </div>
                <button class="add-to-cart">Agregar al Carrito</button>
            </div>
        </div>
    </div>
</body>
</html>
