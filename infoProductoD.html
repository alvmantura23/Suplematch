<!DOCTYPE html>
<html lang="en">
<head>
    <title>Información del Producto</title>
    <link rel="stylesheet" href=infoProductoD.css>
</head>
<body>
    <div class="container">
        <h1>True PRE</h1>
        <div class="product-info">
            <div class="product-image">
                <img src=media/P4_2_True_pre.jfif alt="">
            </div>
            <div class="product-details">
                <p>Es uno de los suplementos con más beneficios para una nutrición deportiva completa y se recomienda su uso durante o después de la actividad física para promover la recuperación muscular y fortalecer el sistema inmunológico.</p>
                <p>Sabor: Natural</p>
                <p>Estado: Disponible</p>
                <p class="price">Precio: S/0.00 <!-- Cambia este precio si es necesario --></p>
                <div class="quantity">
                    <img src=media/shoppingcart32px.png alt="">
                    <label for="quantity">Cantidad:</label>
                    <input type="number" id="quantity" name="quantity" min="1" value="1">
                </div>
                <button class="add-to-cart">Agregar al Carrito</button>
            </div>
        </div>
    </div>
</body>
</html>
